name: Feature request
description: Suggest a change or new capability
type: Feature
labels: [enhancement]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: app/lib
      placeholder: e.g. web app
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Alternatives, mockups, links
    validations:
      required: false
