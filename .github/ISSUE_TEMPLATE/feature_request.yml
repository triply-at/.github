name: Feature request
description: Suggest a change or new capability
type: Feature
labels: [enhancement]
projects: ["triply-at/1"]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: app/lib
      placeholder: e.g. web app
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Idea
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Proposed Solution, Alternatives, Mockups or Links
    validations:
      required: false
